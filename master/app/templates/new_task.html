<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Scan - Afrog Distributed Master</title>
    <link rel="icon" type="image/svg+xml" href="/static/afrog-logo.svg">
    <style>
        body {
            color: #233B46;
            background-color: #C3CAC4;
            padding: 5px 5px;
            min-width: 1220px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        a {
            color: #233B46;
            text-decoration: none;
        }

        .container {
            width: 100%;
            text-align: left;
            padding-bottom: 5px;
            padding-top: 5px;
            background: #4E5B5D;
            color: #B4C1C3;
        }

        .header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            max-width: 30px;
            margin: 0 10px;
        }

        .nav-link {
            color: #B4C1C3;
            font-weight: bold;
            margin: 0 12px;
            text-decoration: none;
        }

        .nav-link:hover {
            color: #fff;
            text-decoration: none;
        }

        .nav-link.active {
            color: #fff;
        }

        .medium {
            color: #C19C00;
            font-weight: bold;
        }

        .card {
            background: #fff;
            padding: 20px;
            margin: 10px 0;
            border-radius: 4px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"],
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 300px;
            font-family: 'Consolas', monospace;
        }

        button {
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 30px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #555;
        }

        .row {
            margin-bottom: 15px;
        }

        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="/static/afrog-logo.svg" alt="Afrog Logo" class="logo"><b class="medium">A F R O G</b>&nbsp;&nbsp;
            <a class="nav-link" href="/results">Reports</a>
            <a class="nav-link" href="/tasks">Tasks</a>
            <a class="nav-link active" href="/tasks/new">New Scan</a>
            <a class="nav-link" href="/workers">Workers</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <label>扫描任务名称</label>
            <input type="text" id="name" placeholder="可选，默认取第一个 URL">
        </div>
        <div class="row">
            <label>目标 URL（每行一个，自动补全 http://）</label>
            <textarea id="urls" placeholder="https://example.com&#10;http://192.168.1.10:8080"></textarea>
        </div>
        <div class="row">
            <label>PoC 关键字（对应 afrog -s 参数，可选，逗号分隔）</label>
            <input type="text" id="search" placeholder="例如: weblogic,jboss">
            <div class="hint">留空则扫描全部内置 PoC</div>
        </div>
        <div class="row">
            <label>漏洞等级过滤（对应 afrog -S 参数，可选）</label>
            <input type="text" id="severity" placeholder="例如: high,critical">
            <div class="hint">critical / high / medium / low / info</div>
        </div>
        <div class="row">
            <button onclick="submitScan()">开始扫描</button>
            <span id="msg" style="margin-left:15px;color:#3a9c3a;font-weight:bold;"></span>
        </div>
    </div>

    <script>
        async function submitScan() {
            var urls = document.getElementById('urls').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
            if (urls.length === 0) {
                alert('请至少输入一个 URL');
                return;
            }
            var payload = {
                name: document.getElementById('name').value.trim(),
                urls: urls,
                options: {
                    search: document.getElementById('search').value.trim(),
                    severity: document.getElementById('severity').value.trim()
                }
            };
            var btn = document.querySelector('button');
            btn.disabled = true;
            try {
                var resp = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    var err = await resp.json();
                    throw new Error(err.detail || 'submit failed');
                }
                var data = await resp.json();
                document.getElementById('msg').textContent = '已创建 ' + data.task_count + ' 个扫描任务';
                setTimeout(function () { window.location.href = '/tasks'; }, 1200);
            } catch (e) {
                alert('提交失败: ' + e.message);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
